<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found · CriticalIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:#0e1a2b;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
.badge{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#0070f3,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;margin:0 auto 1.5rem;}
.code{font-size:6rem;font-weight:900;letter-spacing:-4px;color:transparent;background:linear-gradient(135deg,#3b82f6,#34d399);-webkit-background-clip:text;line-height:1;margin-bottom:0.5rem;}
h1{font-weight:800;font-size:1.6rem;margin-bottom:0.8rem;}
p{color:rgba(255,255,255,0.5);max-width:380px;line-height:1.7;margin-bottom:2rem;}
.links{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
.btn{display:inline-flex;font-family:'Outfit',sans-serif;font-weight:600;font-size:0.9rem;padding:0.65rem 1.5rem;border-radius:8px;text-decoration:none;transition:all 0.2s;}
.btn-a{background:#0070f3;color:white;}
.btn-g{background:transparent;border:1.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);}
</style>
</head>
<body>
<div class="badge">IQ</div>
<div class="code">404</div>
<h1>Page not found</h1>
<p>The page you're looking for doesn't exist. It may have moved, or you may have followed an outdated link.</p>
<div class="links">
<a href="/" class="btn btn-a">← Back to CriticalIQ</a>
<a href="mailto:hello@criticaliq.co.uk" class="btn btn-g">Contact Us</a>
</div>
</body>
</html>
